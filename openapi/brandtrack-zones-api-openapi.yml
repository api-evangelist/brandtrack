                          example: Static
                          nullable: false
                          enum:
                          - DHCP
                          - Static
                        ip_address:
                          type: string
                          description: This field is required when <code>box.connection_settings.ip_protocol_assignment</code> is <code>Static</code>.
                          example: null
                          nullable: false
                        dns_1:
                          type: string
                          description: This field is required when <code>box.connection_settings.ip_protocol_assignment</code> is <code>Static</code>.
                          example: null
                          nullable: false
                        dns_2:
                          type: string
                          description: This field is required when <code>box.connection_settings.ip_protocol_assignment</code> is <code>Static</code>.
                          example: null
                          nullable: false
                        netmask:
                          type: string
                          description: This field is required when <code>box.connection_settings.ip_protocol_assignment</code> is <code>Static</code>.
                          example: null
                          nullable: false
                        gateway:
                          type: string
                          description: This field is required when <code>box.connection_settings.ip_protocol_assignment</code> is <code>Static</code>.
                          example: null
                          nullable: false
                        ntp_address:
                          type: string
                          description: ''
                          example: voluptatem
                          nullable: true
                        proxy_address:
                          type: string
                          description: This field is required when <code>proxy_port</code> is present.
                          example: aliquam
                          nullable: true
                        proxy_port:
                          type: string
                          description: This field is required when <code>proxy_address</code> is present.
                          example: null
                          nullable: true
                        additional_information:
                          type: string
                          description: Must not be greater than 1024 characters.
                          example: qjzybxschlooesxpaijvtq
                          nullable: true
              required:
              - name
              - acknowledgement
              - account_id
  /v2/zones/{id}:
    parameters:
    - in: path
      name: id
      description: The ID of the zone.
      example: 17351
      required: true
      schema:
