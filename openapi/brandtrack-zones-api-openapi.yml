openapi: 3.0.3
info:
  title: Brandtrack API Documentation Accounts Zones API
  description: This is the official documentation for the Brandtrack API.
  version: 1.0.0
servers:
- url: api.brandtrack.fm
security:
- default: []
tags:
- name: Zones
  description: ''
paths:
  /v2/zones:
    get:
      summary: List zones
      operationId: listZones
      description: Return a paginated list of zones available for the authenticated user.
      parameters:
      - in: query
        name: page
        description: The page requested. Default to 1.
        example: 1
        required: false
        schema:
          type: integer
          description: The page requested. Default to 1.
          example: 1
          nullable: false
      - in: query
        name: per_page
        description: The number of items per page. Default to 25.
        example: 100
        required: false
        schema:
          type: integer
          description: The number of items per page. Default to 25.
          example: 100
          nullable: false
      - in: query
        name: order_by
        description: The field to order the results by. Default to id.
        example: id
        required: false
        schema:
          type: string
          description: The field to order the results by. Default to id.
          example: id
          nullable: false
      - in: query
        name: direction
        description: The direction method to sort results. Default to asc.
        example: desc
        required: false
        schema:
          type: string
          description: The direction method to sort results. Default to asc.
          example: desc
          nullable: false
      - in: header
        name: x-customer-api-key
        description: ''
        example: '{YOUR_AUTH_KEY}'
        schema:
          type: string
      responses: {}
      tags:
      - Zones
    post:
      summary: Create a zone
      operationId: createAZone
      description: 'It has an acknowledgement of the creation of the zone. If set to true, the zone will be created even if it is

        over the limits of the account and the subscription will be updated as well. Be aware with it, because you

        might update your subscription.

        <aside class="notice">This endpoint might affect your subscription according to the parameters provided.</aside>'
      parameters:
      - in: header
        name: x-customer-api-key
        description: ''
        example: '{YOUR_AUTH_KEY}'
        schema:
          type: string
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 30120
                    account_id: 19120
                    account_name: John's Bakery US
                    code: '207642'
                    uuid: d1f91b09-f1f9-41d9-ad59-417f6b37766d
                    name: Downtown Bakery
                    store_id: 26440
                    storage_info:
                      available: null
                      required: null
                      is_critical: false
                    volume: 100
                    has_volume_change_pending: false
                    send_logs: false
                    reset_state: false
                    fudo_integration_id: null
                    created_at: '2024-07-31T14:53:07+00:00'
                    updated_at: '2024-07-31T14:53:07+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 30120
                      account_id:
                        type: integer
                        example: 19120
                      account_name:
                        type: string
                        example: John's Bakery US
                      code:
                        type: string
                        example: '207642'
                      uuid:
                        type: string
                        example: d1f91b09-f1f9-41d9-ad59-417f6b37766d
                      name:
                        type: string
                        example: Downtown Bakery
                      store_id:
                        type: integer
                        example: 26440
                      storage_info:
                        type: object
                        properties:
                          available:
                            type: string
                            example: null
                          required:
                            type: string
                            example: null
                          is_critical:
                            type: boolean
                            example: false
                      volume:
                        type: integer
                        example: 100
                      has_volume_change_pending:
                        type: boolean
                        example: false
                      send_logs:
                        type: boolean
                        example: false
                      reset_state:
                        type: boolean
                        example: false
                      fudo_integration_id:
                        type: string
                        example: null
                      created_at:
                        type: string
                        example: '2024-07-31T14:53:07+00:00'
                      updated_at:
                        type: string
                        example: '2024-07-31T14:53:07+00:00'
        404:
          description: Wrong Store ID
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 404 Not Found
                  status_code: 404
                properties:
                  message:
                    type: string
                    example: 404 Not Found
                  status_code:
                    type: integer
                    example: 404
      tags:
      - Zones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: wksbjvmkcdvigzoocmgbmak
                  nullable: false
                normalization_type:
                  type: string
                  description: ''
                  example: '2020'
                  nullable: false
                  enum:
                  - default
                  - '2020'
                  - '2021'
                acknowledgement:
                  type: boolean
                  description: ''
                  example: false
                  nullable: false
                account_id:
                  type: string
                  description: ''
                  example: dolores
                  nullable: false
                smart_integration_ids:
                  type: array
                  description: Must not be greater than 20 characters.
                  example:
                  - ittbqvsmn
                  items:
                    type: string
                store_id:
                  type: string
                  description: This field is required when <code>store</code> is not present.  The <code>id</code> of an existing record in the stores table.
                  example: null
                  nullable: false
                store:
                  type: object
                  description: This field is required when <code>store_id</code> is not present.
                  example: null
                  nullable: false
                  properties:
                    account_id:
                      type: string
                      description: This field is required when <code>store_id</code> is not present.  The <code>id</code> of an existing record in the accounts table.
                      example: null
                      nullable: false
                    name:
                      type: string
                      description: This field is required when <code>store_id</code> is not present. Must not be greater than 100 characters.
                      example: nakazflogfmasszhyfusegkj
                      nullable: false
                    country:
                      type: string
                      description: This field is required when <code>store_id</code> is not present.  The <code>iso</code> of an existing record in the countries table. Must be 2 characters.
                      example: ty
                      nullable: false
                    type:
                      type: string
                      description: This field is required when <code>store_id</code> is not present.
                      example: franchise
                      nullable: false
                      enum:
                      - own
                      - franchise
                    address:
                      type: string
                      description: Must not be greater than 255 characters.
                      example: eeqr
                      nullable: true
                    phone_number:
                      type: string
                      description: Must not be greater than 40 characters.
                      example: smunsajmopwln
                      nullable: true
                    email:
                      type: string
                      description: Must be a valid email address. Must not be greater than 100 characters.
                      example: heaney.clair@example.org
                      nullable: true
                    manager:
                      type: string
