    post:
      summary: 'Invites a user to the platform'
      operationId: invitesAUserToThePlatform
      description: "It will send automatically an email to the provided email address with a unique link to setup the user's account."
      parameters:
        -
          in: header
          name: x-customer-api-key
          description: ''
          example: '{YOUR_AUTH_KEY}'
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 18782
                    uuid: e66f37fd-ac0a-4cb6-adba-33196a5c6f3e
                    email: john.doe@brandtrack.fm
                    firstname: John
                    lastname: Doe
                    phone_number: '+9332312323'
                    country: BE
                    role: owner
                    business_category_id: 62
                    flags: []
                    created_at: '2024-07-09T13:34:16+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 18782
                      uuid:
                        type: string
                        example: e66f37fd-ac0a-4cb6-adba-33196a5c6f3e
                      email:
                        type: string
                        example: john.doe@brandtrack.fm
                      firstname:
                        type: string
                        example: John
                      lastname:
                        type: string
                        example: Doe
                      phone_number:
                        type: string
                        example: '+9332312323'
                      country:
                        type: string
                        example: BE
                      role:
                        type: string
                        example: owner
                      business_category_id:
                        type: integer
                        example: 62
                      flags:
                        type: array
                        example: []
                      created_at:
                        type: string
                        example: '2024-07-09T13:34:16+00:00'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: integer
                  description: 'The account where this user will be created.'
                  example: 19120
                  nullable: true
                email:
                  type: string
                  description: 'The email to be registered.'
                  example: testexample@example.com
                  nullable: false
                firstname:
                  type: string
                  description: "User's firstname."
                  example: John
                  nullable: false
                lastname:
                  type: string
                  description: "User's lastname."
                  example: Doe
                  nullable: false
                role_id:
                  type: integer
                  description: 'The role to assign to the new user.'
                  example: 74
                  nullable: false
              required:
                - account_id
                - email
                - firstname
                - lastname
                - role_id
