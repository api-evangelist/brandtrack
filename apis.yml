aid: brandtrack
name: Brandtrack
description: >-
  Brandtrack is a licensed background-music and in-store audio platform for commercial
  spaces — retail, hospitality, and food & beverage. It centralizes multi-location music
  management with smart scheduling, real-time playlist adaptation to signals like foot
  traffic, weather, and time of day, brand guardrails, AI audio-ad creation, and
  audit-ready licensing documentation. The Brandtrack v2 REST API manages accounts,
  subscriptions, users, locations, zones, groups, and roles, authenticated with an
  x-customer-api-key header, with a partner flow for provisioning customers.
